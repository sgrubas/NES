# C++ port in NES/cpp: build, C++ and Python tests, sanitizers, formatting.
# A separate workflow because GitHub filters by path per workflow, not per job: it runs only when
# NES/cpp or this file changes.
name: cpp

on:
  push:
    paths: ["NES/cpp/**", ".github/workflows/cpp.yml"]
  pull_request:
    paths: ["NES/cpp/**", ".github/workflows/cpp.yml"]
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Linux, GCC)
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: jax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C++ tests (Release, warnings as errors)
        run: |
          cmake -S NES/cpp -B NES/cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build NES/cpp/build --parallel
          ctest --test-dir NES/cpp/build --output-on-failure
      - name: Install NES, eikonalfm and nes-cpp
        run: |
          pip install "jax[cpu]" eikonalfm==0.9.8
          pip install -e .
          pip install "./NES/cpp[test]"
          # The parity tests skip when a reference is missing; here they must run.
          python -c "import eikonalfm, NES"
      - name: Python tests
        run: pytest NES/cpp/tests/python -v

  sanitizers:
    name: C++ tests with AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug build with sanitizers
        run: |
          cmake -S NES/cpp -B NES/cpp/build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build NES/cpp/build --parallel
      - name: C++ tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          # AddressSanitizer of GCC 13 can crash with the 32-bit mmap randomisation of the runners'
          # kernel; 28 bits avoids that.
          sudo sysctl vm.mmap_rnd_bits=28
          ctest --test-dir NES/cpp/build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check formatting (NES/cpp/.clang-format)
        run: |
          pip install clang-format==23.1.3
          clang-format --dry-run --Werror $(git ls-files 'NES/cpp/*.cpp' 'NES/cpp/*.hpp')
